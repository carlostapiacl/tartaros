# Prebuilt binaries for a tag: a GitHub release with them and their SHA-256, and
# the npm packages (@carlostapiacl/tartaros and one per platform) built from
# exactly those binaries.
#
# On a pull request that touches the packaging, the same builds and packs run as
# a dry run: nothing is released or published.
#
# npm, from CI only, through trusted publishing (OIDC, no token). npm cannot
# configure a trusted publisher for a package that does not exist yet, so the
# first version of each package is published by hand from this release's .tgz
# files (see npm/PUBLISHING.md). After that, set the repository variable
# NPM_TRUSTED_PUBLISHING=true and every tag publishes from here.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "npm/**"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, runner: macos-14, target: aarch64-apple-darwin, test: full }
          # No Intel macOS runners any more: cross-compiled, smoke-run under Rosetta.
          - { platform: darwin-x64, runner: macos-14, target: x86_64-apple-darwin, test: none }
          # glibc, built on 22.04 so it runs on glibc 2.35+ (Ubuntu 22.04, Debian 12
          # and later). A static musl build compiles and passes the tests, but its
          # security-bench hangs on the fourth scenario: not shipped until that is
          # understood.
          - { platform: linux-x64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, test: linux }
          - { platform: linux-arm64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, test: linux }
          - { platform: win32-x64, runner: windows-2025, target: x86_64-pc-windows-msvc, test: none }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: toolchain
        shell: bash
        run: rustup target add ${{ matrix.target }}
      - name: build
        shell: bash
        run: cargo build --release --locked -p tartaros-cli --target ${{ matrix.target }}
      # The binary that ships is the one tested: same target, same libc.
      - name: tests (macOS)
        if: matrix.test == 'full'
        run: |
          cargo test --locked --workspace --target ${{ matrix.target }}
          cargo build --locked -p tartaros-bench --target ${{ matrix.target }}
          cd security-bench && ../target/${{ matrix.target }}/debug/tartaros-bench corpus
      # The runner's defaults make part of the corpus unmeasurable: AppArmor
      # restricts unprivileged user namespaces (Ubuntu 23.10+), Yama forbids
      # tracing a non-child, and the root scenarios (mknod, capabilities) only
      # mean something when the launcher is root. Lifted here, so those attacks
      # do succeed without the sandbox and the bench measures that it stops them.
      - name: let the corpus measure everything (Linux)
        if: matrix.test == 'linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo sysctl -w kernel.yama.ptrace_scope=0
      # A release is not made from a run that could not enforce anything.
      - name: tests (Linux)
        if: matrix.test == 'linux'
        run: |
          grep -q landlock /sys/kernel/security/lsm || { echo "::error::no Landlock on this runner"; exit 1; }
          cargo test --locked --workspace --target ${{ matrix.target }}
          cargo build --locked -p tartaros-bench --target ${{ matrix.target }}
          cd security-bench && sudo ../target/${{ matrix.target }}/debug/tartaros-bench corpus
      # The bench reports exit codes only; on a failure, show what tartaros says.
      - name: what tartaros says (on failure)
        if: failure() && matrix.test == 'linux'
        run: |
          w=$(mktemp -d)
          for flags in "" "--seccomp-strict"; do
            echo "== tartaros run --write $w $flags"
            sudo target/${{ matrix.target }}/debug/tartaros run --write "$w" $flags -- sh -c 'echo ok' || echo "rc=$?"
            sudo target/${{ matrix.target }}/debug/tartaros run --write "$w" $flags -- python3 -c 'import os; p=os.fork(); os._exit(0) if p == 0 else os.waitpid(p, 0)' || echo "rc=$?"
          done
      - name: stage the binary
        id: stage
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.platform }}" = win32-x64 ]; then
            cp target/${{ matrix.target }}/release/tartaros.exe dist/tartaros-${{ matrix.platform }}.exe
            echo "bin=dist/tartaros-${{ matrix.platform }}.exe" >> "$GITHUB_OUTPUT"
          else
            cp target/${{ matrix.target }}/release/tartaros dist/tartaros-${{ matrix.platform }}
            echo "bin=dist/tartaros-${{ matrix.platform }}" >> "$GITHUB_OUTPUT"
          fi
      - name: smoke
        shell: bash
        run: |
          bin=${{ steps.stage.outputs.bin }}
          case "${{ matrix.platform }}" in
            darwin-x64)
              if arch -x86_64 /usr/bin/true 2>/dev/null; then arch -x86_64 "$bin" --version
              else echo "::warning::no Rosetta on this runner; darwin-x64 binary not run"; fi ;;
            linux-*)
              "$bin" --version
              echo "needs glibc $(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)" ;;
            *) "$bin" --version ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.platform }}
          path: ${{ steps.stage.outputs.bin }}
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write    # this job only: create the release for the pushed tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: dist/bin
          merge-multiple: true
      - name: version
        id: v
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # The tag has to be the version, or the release says something the code does not.
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME is not v$v (Cargo.toml)"; exit 1
          fi
      - name: checksums
        run: cd dist/bin && sha256sum tartaros-* | tee SHA256SUMS
      - name: npm packages
        run: node npm/build.mjs --version ${{ steps.v.outputs.version }} --bins dist/bin --out dist/npm
      - name: the packed main package installs and runs here
        run: |
          prefix=$(mktemp -d)
          npm i -g --prefix "$prefix" dist/npm/carlostapiacl-tartaros-linux-x64-*.tgz dist/npm/carlostapiacl-tartaros-[0-9]*.tgz
          "$prefix/bin/tartaros" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm
          path: dist/npm/*.tgz
          if-no-files-found: error
      - name: notes from the CHANGELOG
        if: github.event_name == 'push'
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const s = fs.readFileSync("CHANGELOG.md", "utf8");
            const at = s.search(new RegExp("^## \\[" + v.replace(/\./g, "\\.") + "\\]", "m"));
            if (at < 0) { console.error("no CHANGELOG section for " + v); process.exit(1); }
            const rest = s.slice(at).split("\n").slice(1).join("\n");
            const end = rest.search(/^## /m);
            fs.writeFileSync("notes.md", (end < 0 ? rest : rest.slice(0, end)).trim() + "\n");
          '
      - name: create the release, unless it is already there
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists — left as it is"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
              --title "tartaros ${GITHUB_REF_NAME#v}" --notes-file notes.md \
              dist/bin/tartaros-* dist/bin/SHA256SUMS dist/npm/*.tgz
          fi

  npm:
    needs: package
    if: github.event_name == 'push' && vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write    # provenance, and trusted publishing without a token
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 24
      # Trusted publishing needs npm 11.5.1+. No `registry-url` on setup-node:
      # its .npmrc forces token auth and fails ENEEDAUTH before OIDC is tried.
      - name: npm that can publish through OIDC
        run: |
          npm install -g npm@latest
          npm --version
          : > "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm
          path: dist/npm
      # Platform packages first: the main package must never point at versions
      # that are not there. A version already on npm is left as it is, so a
      # re-run after a partial publish finishes the rest. Prereleases need an
      # explicit dist-tag on npm 11; `latest` is what `npm i` with no tag takes.
      - name: publish
        run: |
          publish() {
            name=$(tar -xOzf "$1" package/package.json | node -p 'const p=JSON.parse(require("fs").readFileSync(0));p.name+"@"+p.version')
            if npm view "$name" version >/dev/null 2>&1; then echo "$name already on npm"; return; fi
            npm publish "$1" --provenance --access public --tag latest
          }
          for t in dist/npm/carlostapiacl-tartaros-*-*.tgz; do
            case "$t" in *carlostapiacl-tartaros-[0-9]*) continue ;; esac
            publish "$t"
          done
          publish dist/npm/carlostapiacl-tartaros-[0-9]*.tgz
