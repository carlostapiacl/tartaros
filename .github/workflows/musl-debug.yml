# TEMPORARY: the full security-bench on musl, after the O_PATH fix. Removed before merge.
name: musl-debug
on:
  pull_request:
    paths: [".github/workflows/musl-debug.yml"]
permissions:
  contents: read
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: toolchain
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools >/dev/null
          rustup target add ${{ matrix.target }}
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.yama.ptrace_scope=0
      - name: tests and bench (musl)
        run: |
          cargo test --locked --workspace --target ${{ matrix.target }}
          cargo build --locked -p tartaros-bench --target ${{ matrix.target }}
          cd security-bench && sudo timeout -s KILL 900 ../target/${{ matrix.target }}/debug/tartaros-bench corpus
