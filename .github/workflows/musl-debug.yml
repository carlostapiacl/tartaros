# TEMPORARY: diagnose the musl hang in filesystem-rm-under-read-deny-ancestor.
# Removed before merge.
name: musl-debug
on:
  pull_request:
    paths: [".github/workflows/musl-debug.yml"]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools strace >/dev/null
          rustup target add x86_64-unknown-linux-musl x86_64-unknown-linux-gnu
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          cargo build -q --locked -p tartaros-cli --target x86_64-unknown-linux-musl
          cargo build -q --locked -p tartaros-cli --target x86_64-unknown-linux-gnu
      - name: reproduce
        shell: bash {0}
        run: |
          for t in x86_64-unknown-linux-musl x86_64-unknown-linux-gnu; do
            for who in user root; do
              s=""; [ $who = root ] && s="sudo"
              r=$($s mktemp -d); $s mkdir -p $r/base/project $r/base/outside
              $s sh -c "echo data > $r/base/project/deleteme.txt; echo P > $r/base/outside/protected.txt"
              echo "=== $t as $who (plain)"
              $s timeout -s KILL 20 target/$t/debug/tartaros run --write $r/base/project --read-deny $r/base \
                --read-allow $r/base/project -- sh -c "rm $r/base/project/deleteme.txt && echo control-ok" 2>&1 | grep -v "host daemon socket"
              rc=${PIPESTATUS[0]}; echo "rc=$rc"
              if [ "$rc" = 137 ]; then
                echo "--- hung: again under strace"
                $s sh -c "echo data > $r/base/project/deleteme.txt"
                $s timeout -s KILL 20 strace -f -tt -s 80 -o /tmp/st-$t-$who target/$t/debug/tartaros run --write $r/base/project \
                  --read-deny $r/base --read-allow $r/base/project -- sh -c "rm $r/base/project/deleteme.txt" >/dev/null 2>&1
                echo "--- last 3 syscalls of each pid"
                sudo awk '{n[$1]++; l[$1, n[$1]]=$0} END {for (p in n) for (i=n[p]-2;i<=n[p];i++) if (i>0) print l[p,i]}' /tmp/st-$t-$who | cut -c1-200 | sort -k1,1n -s | tail -40
              fi
            done
          done
