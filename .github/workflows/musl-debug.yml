# TEMPORARY: diagnose the musl hang in filesystem-rm-under-read-deny-ancestor.
# Removed before merge.
name: musl-debug
on:
  pull_request:
    paths: [".github/workflows/musl-debug.yml"]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools strace >/dev/null
          rustup target add x86_64-unknown-linux-musl x86_64-unknown-linux-gnu
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          cargo build -q --locked -p tartaros-cli --target x86_64-unknown-linux-musl
          cargo build -q --locked -p tartaros-cli --target x86_64-unknown-linux-gnu
      - name: who opens the fifo (musl)
        shell: bash {0}
        run: |
          t=x86_64-unknown-linux-musl
          r=$(mktemp -d); mkdir -p $r/base/project $r/base/outside; echo data > $r/base/project/deleteme.txt
          timeout -s KILL 20 strace -f -k -e trace=open,openat -o /tmp/st target/$t/debug/tartaros run --write $r/base/project \
            --read-deny $r/base --read-allow $r/base/project -- true >/dev/null 2>&1
          echo "--- the blocking open and its stack"
          grep -n "clr-debug-pipe" /tmp/st | head -3
          n=$(grep -n "clr-debug-pipe" /tmp/st | head -1 | cut -d: -f1)
          sed -n "$((n)),$((n+40))p" /tmp/st | cut -c1-180
          echo "--- stack of an open on a /tmp entry that returned"
          m=$(grep -n 'open("/tmp/systemd-private' /tmp/st | head -1 | cut -d: -f1)
          sed -n "$m,$((m+45))p" /tmp/st | cut -c1-180
          echo "--- distinct callers of open on /tmp entries"
          grep -A12 'open("/tmp/' /tmp/st | grep -oE '\(([a-z_:0-9<>]+tartaros[a-z_:0-9<>]+|[a-z_]+::[a-z_:0-9<>]+)\+' | sort | uniq -c | sort -rn | head -20
