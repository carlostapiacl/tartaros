name: ci
on:
  # Pull requests only: a merge to master is not tested again, and a tag is
  # tested by release.yml, on the targets it ships.
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", "NOTICE"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner's defaults make part of the corpus unmeasurable: AppArmor
      # restricts unprivileged user namespaces (Ubuntu 23.10+), Yama forbids
      # tracing a non-child, and the root scenarios (mknod, capabilities) only
      # mean something when the launcher is root (the bench runs under sudo).
      - name: let the corpus measure everything
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo sysctl -w kernel.yama.ptrace_scope=0
      - name: build
        run: cargo build --workspace
      - name: unit tests
        run: cargo test --workspace --lib
      - name: detect Landlock
        id: ll
        run: |
          if grep -q landlock /sys/kernel/security/lsm 2>/dev/null; then
            echo "have=1" >> "$GITHUB_OUTPUT"
          else
            echo "have=0" >> "$GITHUB_OUTPUT"
            echo "::warning::Landlock not available on this runner; enforcement tests and the security-bench are skipped"
          fi
      - name: integration tests (Landlock)
        if: steps.ll.outputs.have == '1'
        run: cargo test --workspace
      - name: security-bench (Landlock)
        if: steps.ll.outputs.have == '1'
        run: |
          cargo build -p tartaros-bench
          cd security-bench && sudo ../target/debug/tartaros-bench corpus

  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build
        run: cargo build --workspace
      - name: tests
        run: cargo test --workspace
      - name: security-bench
        run: |
          cargo build -p tartaros-bench
          cd security-bench && ../target/debug/tartaros-bench corpus
