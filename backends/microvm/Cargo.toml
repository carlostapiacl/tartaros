[package]
name = "tartaros-microvm"
description = "microVM backend for tartaros (design stage — true multi-tenant isolation; see docs/microvm-backend.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tartaros-core = { path = "../../core" }
serde_json = "1.0.128"

# Examples only (corpus_runsc harness): parse the security-bench corpus TOML.
[dev-dependencies]
toml = "1.1.8"
serde = { version = "1.0.210", features = ["derive"] }
