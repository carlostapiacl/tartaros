[package]
name = "tartaros-cli"
description = "tartaros command-line: run a command confined by a policy, on the OS backend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "tartaros"
path = "src/main.rs"

[dependencies]
tartaros-core = { path = "../core" }
tartaros-broker = { path = "../broker" }
toml = "0.8.19"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"

[target.'cfg(target_os = "linux")'.dependencies]
tartaros-linux = { path = "../backends/linux" }
tartaros-collect = { path = "../collect" }

[target.'cfg(target_os = "macos")'.dependencies]
tartaros-macos = { path = "../backends/macos" }
tartaros-collect = { path = "../collect" }
