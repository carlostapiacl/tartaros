# STATUS 2026-10-26 (known gap): macos=vacuous, linux=pass
# derived from nolabs-ai/nono crates/nono-cli/tests/socket_access_run.rs (filesystem_directory_deny_blocks_nested_unix_socket_connect_on_macos) (Apache-2.0)
# A unix socket living INSIDE a read-denied directory (think ~/.ssh/agent.sock,
# ~/.docker/run/docker.sock, ~/.gnupg/S.gpg-agent) must not be connectable just
# because connect() is not an open(). Seatbelt blocks it; Landlock does NOT
# mediate pathname-socket connect, so without deny_unix_sockets this is
# EXPECTED to be a VIOLATION on Linux — it documents that read_denies do not
# cover sockets. Fix options: path-scoped seccomp-notify, or default
# deny_unix_sockets when any read_deny contains a socket.
id = "ipc-unix-socket-in-denied-dir"
source = "nolabs-ai/nono crates/nono-cli/tests/socket_access_run.rs (filesystem_directory_deny_blocks_nested_unix_socket_connect_on_macos) (Apache-2.0)"
category = "ipc"
severity = "critical"
os = ["linux", "macos"]

[policy]
writable_roots = ["{root}/work"]
read_denies = ["{root}/home/.gnupg"]

[[unix_server]]
path = "{root}/home/.gnupg/S.agent"

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "python3 -c 'import socket,sys; s=socket.socket(socket.AF_UNIX); s.connect(\"{root}/home/.gnupg/S.agent\"); sys.exit(0)' 2>/dev/null"

[control]
cmd = "echo ok > {root}/work/src/f.txt"
