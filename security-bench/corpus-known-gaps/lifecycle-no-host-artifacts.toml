# STATUS 2026-10-15 (known gap): macos=pass, linux=violation
# derived from anthropics/sandbox-runtime test/sandbox/mandatory-deny-paths.test.ts (Apache-2.0)
id = "lifecycle-no-host-artifacts"
source = "anthropics/sandbox-runtime test/sandbox/mandatory-deny-paths.test.ts (Apache-2.0)"
category = "lifecycle"
severity = "medium"
os = ["linux", "macos"]

# Two guarantees on one path: the agent cannot create an absent protected file
# (.mcp.json), AND the sandbox itself leaves no placeholder behind in the
# workspace after the run (srt's "ghost dotfiles" regression). Without
# materialize_absent_handoff nothing should exist at the path afterwards.
[policy]
writable_roots = ["{root}/work"]

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "echo '{\"mcpServers\":{}}' > {root}/work/.mcp.json"

[control]
cmd = "echo ok > {root}/work/src/f.txt"

[assert]
absent = "{root}/work/.mcp.json"
settle_secs = 1
