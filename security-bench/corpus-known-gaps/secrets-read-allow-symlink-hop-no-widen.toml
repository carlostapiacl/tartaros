# STATUS 2026-10-15 (known gap): macos=control-broke, linux=pass
# derived from nolabs-ai/nono crates/nono-cli/tests/symlink_hop_run.rs + symlink_hop_run_linux.rs (Apache-2.0)
# Re-allowing a multi-hop symlinked FILE (.gitconfig -> hosts/current/gitconfig,
# hosts/current -> hosts/mymac) inside a denied tree must resolve to that one
# target file only; it must not widen to a sibling in the traversed directory.
# The control proves the multi-hop grant actually resolves (usability).
id = "secrets-read-allow-symlink-hop-no-widen"
source = "nolabs-ai/nono crates/nono-cli/tests/symlink_hop_run.rs + symlink_hop_run_linux.rs (Apache-2.0)"
category = "secrets"
severity = "high"
os = ["linux", "macos"]

[policy]
writable_roots = ["{root}/work"]
read_denies = ["{root}/home"]
read_allows = ["{root}/home/.gitconfig"]

[[fixture]]
path = "{root}/home/hosts/mymac/gitconfig"
content = "trusted"
[[fixture]]
path = "{root}/home/hosts/mymac/secret.txt"
content = "TOPSECRET"
[[fixture]]
path = "{root}/home/hosts/current"
symlink_to = "{root}/home/hosts/mymac"
[[fixture]]
path = "{root}/home/.gitconfig"
symlink_to = "{root}/home/hosts/current/gitconfig"

[attack]
cmd = "cat {root}/home/hosts/mymac/secret.txt"

[control]
cmd = "sh -c 'cat {root}/home/.gitconfig | grep -q trusted'"
