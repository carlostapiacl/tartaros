# KNOWN GAP (Linux) — measured 2026-10-13 on the Linux test host: a sandboxed process CAN connect
# to a pathname unix socket OUTSIDE its territory. Landlock (kernel 6.8, ABI ~4) does
# not mediate pathname unix-socket connect. macOS/Seatbelt DOES block it.
# Fix (next): opt-in `Policy.deny_unix_sockets` via seccomp (deny socket(AF_UNIX)),
# default off so real agents that use unix sockets are not broken.
id = "ipc-unix-socket-outside"
category = "ipc"
severity = "critical"
os = ["linux", "macos"]

# a unix socket OUTSIDE the territory must not be reachable from the sandbox
[policy]
writable_roots = ["{root}/work"]

[[unix_server]]
path = "{root}/ipc.sock"

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "python3 -c 'import socket,sys; s=socket.socket(socket.AF_UNIX); s.connect(\"{root}/ipc.sock\"); sys.exit(0)' 2>/dev/null"

[control]
cmd = "echo ok > {root}/work/src/f.txt"
