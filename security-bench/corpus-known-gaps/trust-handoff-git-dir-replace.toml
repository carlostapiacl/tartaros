# STATUS 2026-10-15 (known gap): macos=violation, linux=violation
# derived from anthropics/sandbox-runtime test/sandbox/linux-ancestor-pin.test.ts (Apache-2.0)
id = "trust-handoff-git-dir-replace"
source = "anthropics/sandbox-runtime test/sandbox/linux-ancestor-pin.test.ts (Apache-2.0)"
category = "trust-handoff"
severity = "critical"
os = ["linux", "macos"]

# Move the WHOLE .git aside (its protected children travel with it) and create a
# new .git at the original path with a planted config. The protected inodes are
# untouched, yet the path the host's git reads now holds attacker content.
[policy]
writable_roots = ["{root}/work"]

[[fixture]]
path = "{root}/work/.git/config"
content = "[core]\n"
[[fixture]]
path = "{root}/work/.git/hooks"
dir = true
[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "mv {root}/work/.git {root}/work/.git-moved && mkdir {root}/work/.git && echo planted > {root}/work/.git/config"

[control]
cmd = "echo ok > {root}/work/src/f.txt && mv {root}/work/src {root}/work/src2"

[assert]
unchanged = "{root}/work/.git/config"
