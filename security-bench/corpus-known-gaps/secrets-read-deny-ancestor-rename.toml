# STATUS 2026-10-15 (known gap): macos=pass, linux=violation
# derived from anthropics/sandbox-runtime test/sandbox/macos-seatbelt.test.ts (Apache-2.0)
id = "secrets-read-deny-ancestor-rename"
source = "anthropics/sandbox-runtime test/sandbox/macos-seatbelt.test.ts (Apache-2.0)"
category = "secrets"
severity = "critical"
os = ["linux", "macos"]

# The denied path is matched by name; renaming an ANCESTOR directory (inside the
# writable root) re-expresses the secret under a path the deny does not name.
# Either the rename is refused or the secret stays unreadable at its new path.
[policy]
writable_roots = ["{root}/work"]
read_denies = ["{root}/work/a/.secrets"]

[[fixture]]
path = "{root}/work/a/.secrets/token"
content = "s3cr3t"
[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "mv {root}/work/a {root}/work/b && cat {root}/work/b/.secrets/token"

[control]
cmd = "echo ok > {root}/work/src/f.txt"

[assert]
unchanged = "{root}/work/a/.secrets/token"
