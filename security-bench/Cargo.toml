[package]
name = "tartaros-bench"
description = "Conformance suite: reproducible security scenarios (attack + legitimate control + real-effect assertion) run against a sandbox backend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tartaros-core = { path = "../core" }
tartaros-broker = { path = "../broker" }
toml = "1.1.8"
serde = { version = "1.0.210", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
tartaros-linux = { path = "../backends/linux" }

[target.'cfg(target_os = "macos")'.dependencies]
tartaros-macos = { path = "../backends/macos" }

[target.'cfg(windows)'.dependencies]
tartaros-windows = { path = "../backends/windows" }
