id = "read-deny-dir-listing-inside-root"
category = "secrets"
severity = "high"
os = ["linux", "macos"]

# A read-denied directory inside a writable root, beside a read-deny on a path
# that does not exist (seisin denies `~/.aws` and a role's private folder
# together; on a host with no `~/.aws`). The absent one turns the Linux read carve
# on, and the inside one was left to Landlock, which kept its files unreadable
# but let it be listed: another role saw the names in a private folder (`ls vault`
# printed `secret.md`). Fixed in 0.1.0-alpha.22 by hiding it, with a mount
# namespace, as a read-denied directory outside the roots is.
[policy]
writable_roots = ["{root}/work"]
read_denies = ["{root}/work/vault", "{root}/creds/absent"]

[[fixture]]
path = "{root}/work/vault/secret-name.md"
content = "PRIVATE"
[[fixture]]
path = "{root}/work/src/open.md"
content = "open"
[[fixture]]
path = "{root}/creds"
dir = true

[attack]
cmd = "ls {root}/work/vault | grep -q secret-name"

[control]
cmd = "cat {root}/work/src/open.md >/dev/null && echo ok > {root}/work/src/f.txt"
