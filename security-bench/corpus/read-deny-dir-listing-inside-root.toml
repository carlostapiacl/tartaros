id = "read-deny-dir-listing-inside-root"
category = "secrets"
severity = "high"
os = ["linux", "macos"]

# A read-denied directory inside a writable root, and a read-deny on an absent
# path in a directory above the root (seisin denies `~/.aws` and a role's private
# folder together, with the repo under the home and no `~/.aws`). The absent one
# makes the Linux read carve withhold that directory, and the one inside the root
# was left to Landlock, which kept its files unreadable but let it be listed:
# another role saw the names in a private folder (`ls vault` printed
# `secret.md`). Fixed in 0.1.0-alpha.22 by hiding it, as a read-denied directory
# outside the roots is. It needs a mount namespace; without one the carve cannot
# withhold a listing (docs/limits.md).
requires = ["userns"]
[policy]
writable_roots = ["{root}/work"]
read_denies = ["{root}/work/vault", "{root}/absent"]

[[fixture]]
path = "{root}/work/vault/secret-name.md"
content = "PRIVATE"
[[fixture]]
path = "{root}/work/src/open.md"
content = "open"

[attack]
cmd = "ls {root}/work/vault | grep -q secret-name"

[control]
cmd = "cat {root}/work/src/open.md >/dev/null && echo ok > {root}/work/src/f.txt"
