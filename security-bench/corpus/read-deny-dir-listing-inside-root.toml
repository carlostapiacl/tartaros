id = "read-deny-dir-listing-inside-root"
category = "secrets"
severity = "high"
os = ["linux", "macos"]

# A read-denied directory inside a writable root, beside a read-denied directory
# outside the roots (seisin denies `~/.ssh` and a role's private folder together
# under `isolate`). On Linux with a mount namespace the outside one was hidden and
# the inside one left to Landlock, which kept its files unreadable but let it be
# listed: another role saw the names in a private folder (`ls vault` printed
# `secret.md`). Fixed in 0.1.0-alpha.22 by hiding it the same way.
[policy]
writable_roots = ["{root}/work"]
read_denies = ["{root}/work/vault", "{root}/creds"]

[[fixture]]
path = "{root}/work/vault/secret-name.md"
content = "PRIVATE"
[[fixture]]
path = "{root}/work/src/open.md"
content = "open"
[[fixture]]
path = "{root}/creds/id_ed25519"
content = "KEY"

[attack]
cmd = "ls {root}/work/vault | grep -q secret-name"

[control]
cmd = "cat {root}/work/src/open.md >/dev/null && echo ok > {root}/work/src/f.txt"
