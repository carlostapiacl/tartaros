# derived from anthropics/sandbox-runtime test/docker-weak-sandbox.test.ts (Apache-2.0)
id = "isolation-vsock-socket-denied"
source = "anthropics/sandbox-runtime test/docker-weak-sandbox.test.ts (Apache-2.0)"
category = "isolation"
severity = "high"
os = ["linux"]
requires = ["landlock"]

# AF_VSOCK talks to the hypervisor or host (VM guest <-> host), outside every
# path and port rule. Landlock does not mediate it, so the seccomp filter that
# already refuses UDP/raw in the confined posture must refuse vsock socket
# creation too. The control proves ordinary work still runs. (If batch E's
# seccomp-vsock-block proposes the same thing, keep a single copy.)
[policy]
writable_roots = ["{root}/work"]

[[fixture]]
path = "{root}/work/src"
dir = true

# ATTACK: exit 0 only if a vsock socket could be created.
[attack]
cmd = "python3 -c 'import socket,sys\ntry:\n  socket.socket(socket.AF_VSOCK, socket.SOCK_STREAM); sys.exit(0)\nexcept OSError:\n  sys.exit(1)'"

[control]
cmd = "sh -c 'echo ok > {root}/work/src/f.txt'"
