# derived from anthropics/sandbox-runtime test/sandbox/write-through-links.test.ts (Apache-2.0)
id = "fs-symlink-dangling-create"
source = "anthropics/sandbox-runtime test/sandbox/write-through-links.test.ts (Apache-2.0)"
category = "filesystem"
severity = "critical"
os = ["linux", "macos"]

# A DANGLING symlink in the write root, pointing at an absent name outside it.
# Opening it with O_CREAT would create the target outside the territory.
[policy]
writable_roots = ["{root}/work"]

[[fixture]]
path = "{root}/outside/dir"
dir = true
[[fixture]]
path = "{root}/work/src"
dir = true
[[fixture]]
path = "{root}/work/dangling"
symlink_to = "{root}/outside/dir/not-there"

[attack]
cmd = "echo new > {root}/work/dangling"

[control]
cmd = "echo ok > {root}/work/src/f.txt"

[assert]
absent = "{root}/outside/dir/not-there"
