# derived from anthropics/sandbox-runtime test/sandbox/allow-read.test.ts (Apache-2.0)
id = "secrets-read-deny-firmlink"
source = "anthropics/sandbox-runtime test/sandbox/allow-read.test.ts (Apache-2.0)"
category = "secrets"
severity = "critical"
os = ["macos"]

# macOS 10.15+ exposes the data volume a second time under /System/Volumes/Data
# (a firmlink). A path-string deny on {root}/vault must also hold for
# /System/Volumes/Data{root}/vault.
[policy]
writable_roots = ["{root}/work"]
read_denies = ["{root}/vault"]

[[fixture]]
path = "{root}/vault/key"
content = "TOPSECRET"
[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "cat /System/Volumes/Data{root}/vault/key"

[control]
cmd = "echo ok > {root}/work/src/f.txt"
