# derived from anthropics/sandbox-runtime test/sandbox/credential-deny.test.ts (Apache-2.0)
id = "secrets-read-deny-single-file"
source = "anthropics/sandbox-runtime test/sandbox/credential-deny.test.ts (Apache-2.0)"
category = "secrets"
severity = "critical"
os = ["linux", "macos"]

# Credentials usually live as single dotfiles next to harmless files ($HOME/.netrc
# beside $HOME/notes). Denying the FILE must block it while its siblings in the
# same directory stay readable — a backend that can only deny whole directories
# either leaks the file or breaks the control. Content-based check: a backend that
# "denies" by substituting an empty file also passes.
[policy]
writable_roots = ["{root}/work"]
read_denies = ["{root}/home/.netrc"]

[[fixture]]
path = "{root}/home/.netrc"
content = "machine forge.example password hunter2"
[[fixture]]
path = "{root}/home/notes.txt"
content = "public"
[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "grep -q hunter2 {root}/home/.netrc"

[control]
cmd = "sh -c 'grep -q public {root}/home/notes.txt && echo ok > {root}/work/src/f.txt'"

[assert]
unchanged = "{root}/home/.netrc"
