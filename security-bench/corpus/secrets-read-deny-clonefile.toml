# derived from anthropics/sandbox-runtime test/sandbox/allow-read.test.ts (Apache-2.0)
id = "secrets-read-deny-clonefile"
source = "anthropics/sandbox-runtime test/sandbox/allow-read.test.ts (Apache-2.0)"
category = "secrets"
severity = "critical"
os = ["macos"]

# APFS clonefile (cp -c) creates a new inode sharing the denied file's blocks
# under a readable name. It must not succeed (or the clone must not be readable).
[policy]
writable_roots = ["{root}/work"]
read_denies = ["{root}/work/.env"]

[[fixture]]
path = "{root}/work/.env"
content = "TOPSECRET"
[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "sh -c 'cp -c {root}/work/.env {root}/work/clone.txt 2>/dev/null && grep -q TOPSECRET {root}/work/clone.txt'"

[control]
cmd = "echo ok > {root}/work/src/f.txt"

[assert]
absent = "{root}/work/clone.txt"
