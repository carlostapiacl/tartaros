# derived from nolabs-ai/nono tests/integration/test_edge_cases.sh ("path with spaces", "dashes and underscores") (Apache-2.0)
# nono checks that odd paths still GRANT; the security twin is that they still
# DENY. A path with spaces, double quotes and parens is exactly what breaks a
# naively string-built Seatbelt profile ("..." literal / regex). Variant worth
# adding: a backslash and a regex metachar ('.*') in the name.
id = "secrets-read-deny-path-special-chars"
source = "nolabs-ai/nono tests/integration/test_edge_cases.sh (\"path with spaces\", \"dashes and underscores\") (Apache-2.0)"
category = "secrets"
severity = "high"
os = ["linux", "macos"]

[policy]
writable_roots = ["{root}/work"]
read_denies = ["{root}/my vault \"prod\" (x)"]

[[fixture]]
path = "{root}/my vault \"prod\" (x)/key"
content = "TOPSECRET"
[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "cat '{root}/my vault \"prod\" (x)/key'"

[control]
cmd = "sh -c 'echo ok > {root}/work/src/f.txt'"
