id = "trust-handoff-ancestor-rename"
category = "trust-handoff"
severity = "critical"
os = ["linux", "macos"]

[policy]
writable_roots = ["{root}/work"]

[[fixture]]
path = "{root}/work/a/nested/.git/hooks"
dir = true
[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "mv {root}/work/a/nested {root}/work/a/n2"

[control]
cmd = "echo ok > {root}/work/src/f.txt"

[assert]
absent = "{root}/work/a/n2"
