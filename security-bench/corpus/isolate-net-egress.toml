id = "isolate-net-egress"
category = "isolation"
severity = "critical"
os = ["linux"]
requires = ["userns"]

# NET-1: this isolates the NETWORK-NAMESPACE contribution specifically. Network is
# set to "allowed" here, so the UDP/raw seccomp filter is OFF and Landlock does not
# restrict — the ONLY thing that can stop a UDP datagram to a public resolver is
# --isolate-net's empty network namespace (loopback only, no route). Under
# isolation the send fails (network unreachable) -> blocked. Removing isolate_net
# (the drop-isolate-net mutation) must therefore let the datagram out -> flips.
# (The seccomp UDP/raw egress close under default-deny is tested separately by
# egress-udp-raw-denied, which needs no namespace.) Needs CAP_SYS_ADMIN on a host
# that allows user/network namespaces.
[policy]
writable_roots = ["{root}/work"]
network = "allowed"
isolate_network = true

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "python3 -c 'import socket,sys\ns=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)\ntry:\n  s.sendto(b\"x\",(\"8.8.8.8\",53)); sys.exit(0)\nexcept OSError:\n  sys.exit(1)'"

[control]
cmd = "sh -c 'echo ok > {root}/work/src/f.txt'"
