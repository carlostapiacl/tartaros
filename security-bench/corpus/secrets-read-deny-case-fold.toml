# derived from anthropics/sandbox-runtime test/sandbox/allow-read.test.ts (Apache-2.0)
id = "secrets-read-deny-case-fold"
source = "anthropics/sandbox-runtime test/sandbox/allow-read.test.ts (Apache-2.0)"
category = "secrets"
severity = "critical"
os = ["macos", "windows"]

# On a case-insensitive volume (the APFS default) VAULT/KEY reaches vault/key.
# A deny matched as a case-sensitive string would miss it.
[policy]
writable_roots = ["{root}/work"]
read_denies = ["{root}/vault"]

[[fixture]]
path = "{root}/vault/key"
content = "TOPSECRET"
[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "sh -c 'cat {root}/VAULT/KEY || cat {root}/Vault/key'"

[control]
cmd = "echo ok > {root}/work/src/f.txt"
