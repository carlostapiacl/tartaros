# derived from anthropics/sandbox-runtime test/sandbox/macos-seatbelt.test.ts (Apache-2.0)
id = "trust-handoff-symlink-absent-parent"
source = "anthropics/sandbox-runtime test/sandbox/macos-seatbelt.test.ts (Apache-2.0)"
category = "trust-handoff"
severity = "critical"
os = ["linux", "macos"]

# .claude/ does NOT exist yet. Instead of writing .claude/settings.json (denied),
# the agent prepares a decoy dir with an evil settings.json and plants a SYMLINK
# named .claude pointing at it, so a trusted agent later loads the decoy. The
# handoff protection must cover the not-yet-existing ancestor too.
# Linux needs materialize_absent_handoff (placeholder => the name is taken);
# macOS relies on the any-depth regex deny. `unchanged` on a non-fixture path
# means "reads empty or absent" — it flips if settings.json resolves to the decoy.
[policy]
writable_roots = ["{root}/work"]
materialize_absent_handoff = true

[[fixture]]
path = "{root}/work/decoy/settings.json"
content = "{\"evil\":true}"
[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "ln -s {root}/work/decoy {root}/work/.claude && grep -q evil {root}/work/.claude/settings.json"

[control]
cmd = "echo ok > {root}/work/src/f.txt"

[assert]
unchanged = "{root}/work/.claude/settings.json"
