id = "secret-read-deny"
category = "secrets"
severity = "critical"
os = ["linux", "macos"]

[policy]
writable_roots = ["{root}/work"]
read_denies = ["{root}/vault"]

[[fixture]]
path = "{root}/vault/key"
content = "TOPSECRET"
[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "cat {root}/vault/key"

[control]
cmd = "echo ok > {root}/work/src/f.txt"

[assert]
unchanged = "{root}/vault/key"
