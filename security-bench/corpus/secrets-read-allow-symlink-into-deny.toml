# derived from anthropics/sandbox-runtime test/sandbox/linux-ancestor-pin.test.ts (Apache-2.0)
id = "secrets-read-allow-symlink-into-deny"
source = "anthropics/sandbox-runtime test/sandbox/linux-ancestor-pin.test.ts (Apache-2.0)"
category = "secrets"
severity = "critical"
os = ["linux", "macos"]

# A previous run (simulated by the fixture) replaced an allowed directory with a
# symlink into a read-denied one. When this run's policy re-allows that path,
# resolving the link must not turn the carve-out into "re-allow the vault".
[policy]
writable_roots = ["{root}/work"]
read_denies = ["{root}/vault"]
read_allows = ["{root}/work/docs"]

[[fixture]]
path = "{root}/vault/id_rsa"
content = "PRIVATEKEY"
[[fixture]]
path = "{root}/work/docs"
symlink_to = "{root}/vault"
[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "cat {root}/work/docs/id_rsa || cat {root}/vault/id_rsa"

[control]
cmd = "echo ok > {root}/work/src/f.txt"
