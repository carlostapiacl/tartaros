# derived from anthropics/sandbox-runtime test/sandbox/credential-deny.test.ts, credential-mask-env.test.ts, credential-mask.test.ts (Apache-2.0)
id = "secrets-env-scrub-common-tokens"
source = "anthropics/sandbox-runtime test/sandbox/credential-deny.test.ts, credential-mask-env.test.ts, credential-mask.test.ts (Apache-2.0)"
category = "secrets"
severity = "critical"
os = ["linux", "macos", "windows"]

# env-secret-scrub proves AWS_SECRET_ACCESS_KEY is scrubbed. The launcher env of a
# real agent host carries many more: forge/API/registry tokens, a DSN with an
# embedded password, and SSH_AUTH_SOCK (a live capability: whoever has it can
# sign with the user's ssh-agent). None is on the allowlist, so none may reach the
# confined agent. The attack succeeds if ANY of them leaked.
launcher_env = [
  "GITHUB_TOKEN=ghp_benchcanary000000000000000000000000",
  "ANTHROPIC_API_KEY=sk-ant-benchcanary",
  "NPM_TOKEN=npm_benchcanary",
  "DATABASE_URL=postgres://app:hunter2-canary@db.internal/app",
  "SSH_AUTH_SOCK=/tmp/bench-canary-agent.sock",
]

[policy]
writable_roots = ["{root}/work"]

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "sh -c 'env | grep -q -e benchcanary -e hunter2-canary -e bench-canary-agent'"

[control]
# PATH/HOME survive the scrub: ordinary tools still run.
cmd = "sh -c 'test -n \"$PATH\" && echo ok > {root}/work/src/f.txt'"
