# derived from nolabs-ai/nono crates/nono-cli/tests/symlink_hop_run.rs (symlinked grants must resolve) (Apache-2.0)
# The deny is declared on a path that is itself a SYMLINK (dotfile managers:
# ~/.aws -> ~/dotfiles/aws, ~/.ssh -> ~/Dropbox/ssh). Seatbelt and Landlock
# both act on the RESOLVED object, so the deny must be applied to the target;
# reading via the declared path or via the real path must both fail.
id = "secrets-read-deny-on-symlinked-path"
source = "nolabs-ai/nono crates/nono-cli/tests/symlink_hop_run.rs (symlinked grants must resolve) (Apache-2.0)"
category = "secrets"
severity = "critical"
os = ["linux", "macos"]

[policy]
writable_roots = ["{root}/work"]
read_denies = ["{root}/home/.aws"]

[[fixture]]
path = "{root}/dotfiles/aws/credentials"
content = "aws_secret_access_key=TOPSECRET"
[[fixture]]
path = "{root}/home/.aws"
symlink_to = "{root}/dotfiles/aws"
[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "sh -c 'cat {root}/home/.aws/credentials || cat {root}/dotfiles/aws/credentials'"

[control]
cmd = "sh -c 'echo ok > {root}/work/src/f.txt'"
