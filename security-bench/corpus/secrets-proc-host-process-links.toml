# derived from openai/codex codex-rs/linux-sandbox/tests/suite/daemon_sockets_tests.rs::daemon_sockets_are_hidden_with_network_and_tmp_write_grants (host-proc mode) (Apache-2.0)
id = "secrets-proc-host-process-links"
source = "openai/codex codex-rs/linux-sandbox/tests/suite/daemon_sockets_tests.rs::daemon_sockets_are_hidden_with_network_and_tmp_write_grants (host-proc mode) (Apache-2.0)"
category = "secrets"
severity = "high"
os = ["linux"]

# The launcher's /proc/<ppid>/{root,cwd,environ} must not be usable from inside
# (environ would leak the very secrets env-secret-scrub removes). Attack reads
# the parent's environ looking for the launcher-only secret.
launcher_env = ["TARTAROS_BENCH_CANARY=leak-me"]

[policy]
writable_roots = ["{root}/work"]

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "sh -c 'for p in $(ls /proc | grep -E \"^[0-9]+$\"); do tr \"\\0\" \"\\n\" < /proc/$p/environ 2>/dev/null | grep -q leak-me && exit 0; done; exit 1'"

[control]
cmd = "cat /proc/self/status >/dev/null && echo ok > {root}/work/src/f.txt"
