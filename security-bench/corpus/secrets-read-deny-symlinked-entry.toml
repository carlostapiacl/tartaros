# derived from anthropics/sandbox-runtime test/sandbox/credential-deny.test.ts (Apache-2.0)
id = "secrets-read-deny-symlinked-entry"
source = "anthropics/sandbox-runtime test/sandbox/credential-deny.test.ts (Apache-2.0)"
category = "secrets"
severity = "critical"
os = ["linux", "macos"]

# Dotfile-manager layout: the path the user denies ($HOME/.netrc) is a SYMLINK and
# the secret bytes live at its target (dotfiles/netrc). The deny must follow the
# link and protect the target — reading through the link AND reading the target
# by its own path must both fail. (read-deny-symlink-bypass covers the reverse:
# the agent plants a link to a denied real file.)
[policy]
writable_roots = ["{root}/work"]
read_denies = ["{root}/home/.netrc"]

[[fixture]]
path = "{root}/dotfiles/netrc"
content = "machine forge.example password hunter2"
[[fixture]]
path = "{root}/dotfiles/vimrc"
content = "public"
[[fixture]]
path = "{root}/home/.netrc"
symlink_to = "{root}/dotfiles/netrc"
[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "sh -c 'grep -q hunter2 {root}/home/.netrc || grep -q hunter2 {root}/dotfiles/netrc'"

[control]
cmd = "sh -c 'grep -q public {root}/dotfiles/vimrc && echo ok > {root}/work/src/f.txt'"
