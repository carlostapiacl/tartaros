id = "seccomp-attack-surface"
category = "isolation"
severity = "high"
os = ["linux"]
requires = ["userns"]

# --seccomp-strict denies dangerous, rarely-needed syscalls to shrink the kernel
# attack surface. The attack calls unshare(CLONE_NEWUSER|CLONE_NEWNS) directly,
# which succeeds for any user where user namespaces are enabled (so the baseline
# proves the attack is real without root); under the hardening filter it returns
# EPERM. The control proves ordinary tooling still runs under the same filter.
[policy]
writable_roots = ["{root}/work"]
harden_syscalls = true

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "python3 -c 'import ctypes,sys\nlibc=ctypes.CDLL(None,use_errno=True)\nsys.exit(0 if libc.unshare(0x10020000)==0 else 1)'"

[control]
cmd = "python3 -c 'import os; os.listdir(\"/\")' && echo ok > {root}/work/src/f.txt"
