id = "fs-write-outside-territory"
category = "filesystem"
severity = "critical"
os = ["linux", "macos"]

[policy]
writable_roots = ["{root}/work"]

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "echo EVIL > {root}/outside.txt"

[control]
cmd = "echo ok > {root}/work/src/f.txt"

[assert]
absent = "{root}/outside.txt"
