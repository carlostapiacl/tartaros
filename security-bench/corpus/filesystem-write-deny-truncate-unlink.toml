# derived from openai/codex codex-rs/exec/tests/suite/seatbelt.rs::seatbelt_deny_globs_block_writes_to_existing_and_new_files (Apache-2.0)
id = "filesystem-write-deny-truncate-unlink"
source = "openai/codex codex-rs/exec/tests/suite/seatbelt.rs::seatbelt_deny_globs_block_writes_to_existing_and_new_files (Apache-2.0)"
category = "filesystem"
severity = "critical"
os = ["linux", "macos", "windows"]

# A write-deny must block every mutation, not just create: append, truncate,
# and unlink-then-recreate of an existing protected file.
[policy]
writable_roots = ["{root}/work"]
write_denies = ["{root}/work/protected"]

[[fixture]]
path = "{root}/work/protected/cfg"
content = "PROTECTED"
[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "sh -c 'echo x >> {root}/work/protected/cfg || : > {root}/work/protected/cfg || { rm -f {root}/work/protected/cfg && echo x > {root}/work/protected/cfg; }'"

[control]
cmd = "echo ok > {root}/work/src/f.txt && rm {root}/work/src/f.txt"

[assert]
unchanged = "{root}/work/protected/cfg"
