# derived from openai/codex codex-rs/exec/tests/suite/sandbox.rs::sandbox_distinguishes_command_and_policy_cwds (Apache-2.0)
id = "filesystem-command-cwd-not-writable"
source = "openai/codex codex-rs/exec/tests/suite/sandbox.rs::sandbox_distinguishes_command_and_policy_cwds (Apache-2.0)"
category = "filesystem"
severity = "high"
os = ["linux", "macos"]

# Being the process's cwd confers no write right: cd into a non-writable dir and
# write a relative path.
[policy]
writable_roots = ["{root}/work"]

[[fixture]]
path = "{root}/elsewhere"
dir = true
[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "cd {root}/elsewhere && echo forbidden > forbidden.txt"

[control]
cmd = "cd {root}/work/src && echo ok > f.txt"

[assert]
absent = "{root}/elsewhere/forbidden.txt"
