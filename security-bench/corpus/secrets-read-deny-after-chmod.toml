# derived from anthropics/sandbox-runtime test/sandbox/linux-ancestor-pin-errno.test.ts (Apache-2.0)
id = "secrets-read-deny-after-chmod"
source = "anthropics/sandbox-runtime test/sandbox/linux-ancestor-pin-errno.test.ts (Apache-2.0)"
category = "secrets"
severity = "high"
os = ["linux", "macos", "windows"]

# A read-denied secret whose parent the agent (or a previous run) made
# un-inspectable with chmod 000: policy compilation must not silently skip the
# deny because it could not stat the path; the agent can chmod it back and read.
# Fixture modes cannot be set, so the attack does chmod 000 / chmod 755 itself;
# the deny was compiled before, which is the weaker half of the guarantee.
[policy]
writable_roots = ["{root}/work"]
read_denies = ["{root}/work/cfg/secrets/key"]

[[fixture]]
path = "{root}/work/cfg/secrets/key"
content = "K"
[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "chmod 000 {root}/work/cfg/secrets; chmod 755 {root}/work/cfg/secrets && cat {root}/work/cfg/secrets/key"

[control]
cmd = "echo ok > {root}/work/src/f.txt"
