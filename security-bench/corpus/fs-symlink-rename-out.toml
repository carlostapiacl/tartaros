# derived from anthropics/sandbox-runtime test/sandbox/write-through-links.test.ts (Apache-2.0)
id = "fs-symlink-rename-out"
source = "anthropics/sandbox-runtime test/sandbox/write-through-links.test.ts (Apache-2.0)"
category = "filesystem"
severity = "critical"
os = ["linux", "macos"]

# rename(2) is a different path from open+write. The agent writes a file in its
# root, then moves it ONTO an outside file through a symlinked directory.
[policy]
writable_roots = ["{root}/work"]

[[fixture]]
path = "{root}/outside/dir/file"
content = "original"
[[fixture]]
path = "{root}/work/src"
dir = true
[[fixture]]
path = "{root}/work/link-to-dir"
symlink_to = "{root}/outside/dir"

[attack]
cmd = "echo changed > {root}/work/made && mv {root}/work/made {root}/work/link-to-dir/file"

[control]
cmd = "echo ok > {root}/work/src/f.txt"

[assert]
unchanged = "{root}/outside/dir/file"
