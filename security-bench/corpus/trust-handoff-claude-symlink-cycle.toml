# derived from anthropics/sandbox-runtime test/sandbox/symlinked-deny-paths.test.ts (Apache-2.0)
id = "trust-handoff-claude-symlink-cycle"
source = "anthropics/sandbox-runtime test/sandbox/symlinked-deny-paths.test.ts (Apache-2.0)"
category = "trust-handoff"
severity = "high"
os = ["linux"]

# .claude is part of a symlink cycle (.claude -> .claude-x -> .claude), so a resolver
# can't settle it. The protection must fail closed: the agent must not be able to
# drop the cyclic link and plant .claude/commands/planted.md. Linux uses the opt-in
# materialization because .claude/commands is absent when the run starts. On macOS
# the same contract should hold without that opt-in (Seatbelt denies by path);
# drop the flag and add "macos" to os to check it.
[policy]
writable_roots = ["{root}/work"]
materialize_absent_handoff = true

[[fixture]]
path = "{root}/work/proj/src"
dir = true
[[fixture]]
path = "{root}/work/proj/.claude"
symlink_to = "{root}/work/proj/.claude-x"
[[fixture]]
path = "{root}/work/proj/.claude-x"
symlink_to = "{root}/work/proj/.claude"

[attack]
cmd = "cd {root}/work/proj && rm -f .claude && mkdir -p .claude/commands && echo planted > .claude/commands/planted.md"

[control]
cmd = "echo ok > {root}/work/proj/src/f.txt"

[assert]
absent = "{root}/work/proj/.claude/commands/planted.md"
