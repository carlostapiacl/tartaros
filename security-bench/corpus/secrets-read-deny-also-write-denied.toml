# derived from anthropics/sandbox-runtime test/sandbox/wrap-with-sandbox.test.ts (Apache-2.0)
id = "secrets-read-deny-also-write-denied"
source = "anthropics/sandbox-runtime test/sandbox/wrap-with-sandbox.test.ts (Apache-2.0)"
category = "secrets"
severity = "critical"
os = ["linux", "macos", "windows"]

# The same path named in BOTH read_denies and write_denies: compiling the write
# deny (a read-only grant) must not re-open the read the other rule closed.
[policy]
writable_roots = ["{root}/work"]
read_denies = ["{root}/work/.secrets"]
write_denies = ["{root}/work/.secrets"]

[[fixture]]
path = "{root}/work/.secrets/token"
content = "s3cr3t"
[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "cat {root}/work/.secrets/token"

[control]
cmd = "echo ok > {root}/work/src/f.txt"

[assert]
unchanged = "{root}/work/.secrets/token"
