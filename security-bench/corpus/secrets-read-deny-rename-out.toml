# derived from anthropics/sandbox-runtime test/sandbox/read-list-precedence.test.ts, test/sandbox/allow-read.test.ts (Apache-2.0)
id = "secrets-read-deny-rename-out"
source = "anthropics/sandbox-runtime test/sandbox/read-list-precedence.test.ts, test/sandbox/allow-read.test.ts (Apache-2.0)"
category = "secrets"
severity = "critical"
os = ["linux", "macos", "windows"]

# A read-denied secret that sits INSIDE a writable root can be renamed by the
# agent (rename is a write on the directory). If the deny is path-based and the
# rename lands the inode under a readable name, the secret leaks. Three shapes:
# rename the file out, rename its parent dir out, rename the dir that encloses a
# deeper deny. Any one succeeding (exit 0) is a violation.
[policy]
writable_roots = ["{root}/box", "{root}/out"]
read_denies = ["{root}/box/token", "{root}/box/dir", "{root}/box/outer/deep/nested.txt"]

[[fixture]]
path = "{root}/box/token"
content = "TOPSECRET"
[[fixture]]
path = "{root}/box/dir/token"
content = "TOPSECRET"
[[fixture]]
path = "{root}/box/outer/deep/nested.txt"
content = "TOPSECRET"
[[fixture]]
path = "{root}/box/plain"
content = "plain"
[[fixture]]
path = "{root}/out"
dir = true

[attack]
cmd = "sh -c '(mv {root}/box/token {root}/out/t 2>/dev/null && grep -q TOPSECRET {root}/out/t) || (mv {root}/box/dir {root}/out/d 2>/dev/null && grep -q TOPSECRET {root}/out/d/token) || (mv {root}/box/outer {root}/out/o 2>/dev/null && grep -q TOPSECRET {root}/out/o/deep/nested.txt)'"

[control]
# Moving an ordinary file between the two writable roots still works.
cmd = "sh -c 'mv {root}/box/plain {root}/out/plain && cat {root}/out/plain >/dev/null'"

[assert]
unchanged = "{root}/box/token"
