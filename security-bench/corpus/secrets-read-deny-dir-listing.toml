# derived from nolabs-ai/nono tests/integration/test_sensitive_paths.sh ("~/.ssh directory blocked": ls ~/.ssh/) and test_gpu.sh (READ_DIR vs READ_FILE caveat) (Apache-2.0)
# secret-read-deny proves file CONTENTS are denied. Listing the denied dir is a
# separate right (Landlock READ_DIR, Seatbelt file-read-data on the dir) and
# leaks key names, profile names, account ids. Must be denied too.
id = "secrets-read-deny-dir-listing"
source = "nolabs-ai/nono tests/integration/test_sensitive_paths.sh (\"~/.ssh directory blocked\": ls ~/.ssh/) and test_gpu.sh (READ_DIR vs READ_FILE caveat) (Apache-2.0)"
category = "secrets"
severity = "high"
os = ["linux", "macos", "windows"]

[policy]
writable_roots = ["{root}/work"]
read_denies = ["{root}/home/.aws"]

[[fixture]]
path = "{root}/home/.aws/credentials-prod-account-123456"
content = "k"
[[fixture]]
path = "{root}/work/src"
dir = true

# exit 0 only if the listing actually returned the filename
[attack]
cmd = "sh -c 'ls {root}/home/.aws | grep -q credentials-prod'"

[control]
cmd = "sh -c 'ls {root}/work >/dev/null && echo ok > {root}/work/src/f.txt'"
