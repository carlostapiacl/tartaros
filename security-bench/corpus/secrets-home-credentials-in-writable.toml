# derived from openai/codex codex-rs/sandboxing/src/seatbelt_tests.rs::seatbelt_protects_aws_in_extra_writable_home and codex-rs/linux-sandbox/tests/suite/sandbox.rs::sandbox_blocks_metadata_writes_inside_writable_root (Apache-2.0)
id = "secrets-home-credentials-in-writable"
source = "openai/codex codex-rs/sandboxing/src/seatbelt_tests.rs::seatbelt_protects_aws_in_extra_writable_home and codex-rs/linux-sandbox/tests/suite/sandbox.rs::sandbox_blocks_metadata_writes_inside_writable_root (Apache-2.0)"
category = "secrets"
severity = "high"
os = ["linux", "macos", "windows"]

# When a HOME-like dir is a writable root, credential configs (.aws/config) must
# stay unmodifiable (write, rename-away, replace). Expressed with an explicit
# write_deny since our schema has no built-in credential set; if tartaros adds
# a default-protected set, drop the write_denies line and this becomes a test of it.
[policy]
writable_roots = ["{root}/home"]
write_denies = ["{root}/home/.aws"]

[[fixture]]
path = "{root}/home/.aws/config"
content = "original"
[[fixture]]
path = "{root}/home/replacement"
content = "evil"

[attack]
cmd = "sh -c 'echo x > {root}/home/.aws/config || mv {root}/home/replacement {root}/home/.aws/config || mv {root}/home/.aws {root}/home/aws2'"

[control]
cmd = "echo permitted > {root}/home/allowed"

[assert]
unchanged = "{root}/home/.aws/config"
