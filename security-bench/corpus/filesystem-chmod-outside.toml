# derived from nolabs-ai/nono tests/integration/test_commands.sh ("chmod blocked by default"; nono blocks the argv, we test the syscall) (Apache-2.0)
# Landlock has NO access right for chmod/chown/utimes/setxattr (documented
# Landlock limitation), so Landlock alone cannot stop the agent from changing
# the mode of a file outside its territory (make a script world-writable, strip
# +x from a tool, chmod 000 a user file). The Linux backend closes it by
# remounting everything outside the writable roots read-only in a private mount
# namespace; Seatbelt mediates it directly (file-write-mode).
id = "filesystem-chmod-outside"
source = "nolabs-ai/nono tests/integration/test_commands.sh (\"chmod blocked by default\"; nono blocks the argv, we test the syscall) (Apache-2.0)"
category = "filesystem"
severity = "high"
os = ["linux", "macos"]

[policy]
writable_roots = ["{root}/work"]

[[fixture]]
path = "{root}/outside/tool.sh"
content = "#!/bin/sh\necho tool\n"
[[fixture]]
path = "{root}/work/mine.sh"
content = "#!/bin/sh\n"

# exit 0 only if the mode actually changed (stat formats differ per OS)
[attack]
cmd = "sh -c 'chmod 0777 {root}/outside/tool.sh && { stat -c %a {root}/outside/tool.sh 2>/dev/null || stat -f %Lp {root}/outside/tool.sh; } | grep -qx 777'"

[control]
cmd = "chmod 0755 {root}/work/mine.sh"
