# derived from nolabs-ai/nono tests/integration/test_env_sanitization.sh + crates/nono-cli/src/exec_strategy/env_sanitization.rs (Apache-2.0)
# nono strips loader/interpreter injection vars EVEN when the env policy is
# "allow everything". tartaros does the same under inherit_env: the loader and
# interpreter injection variables (LD_*, DYLD_*, BASH_ENV, NODE_OPTIONS, …) never
# reach the agent, whatever the launcher's environment holds.
launcher_env = ["LD_PRELOAD=/nonexistent/evil.so", "BASH_ENV=/nonexistent/evil.sh"]
id = "secrets-env-loader-injection-inherit"
source = "nolabs-ai/nono tests/integration/test_env_sanitization.sh + crates/nono-cli/src/exec_strategy/env_sanitization.rs (Apache-2.0)"
category = "secrets"
severity = "medium"
os = ["linux", "macos"]

[policy]
writable_roots = ["{root}/work"]
inherit_env = true

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = 'test -n "$LD_PRELOAD$BASH_ENV"'

[control]
cmd = "sh -c 'echo ok > {root}/work/src/f.txt'"
