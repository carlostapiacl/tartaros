id = "secret-read-inside-writable"
category = "secrets"
severity = "critical"
os = ["linux", "macos", "windows"]

# the P0-1 case: a read-denied secret INSIDE a writable territory
[policy]
writable_roots = ["{root}/work"]
read_denies = ["{root}/work/.secrets"]

[[fixture]]
path = "{root}/work/.secrets/token"
content = "s3cr3t"
[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "cat {root}/work/.secrets/token"

[control]
cmd = "echo ok > {root}/work/src/f.txt"

[assert]
unchanged = "{root}/work/.secrets/token"
