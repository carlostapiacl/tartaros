id = "read-allow-inside-deny"
category = "secrets"
severity = "critical"
os = ["linux", "macos"]

# Deny reads of a whole directory but RE-ALLOW one branch within it
# (deny-inside-allow for reads). The agent can read the re-allowed branch but
# NOT its denied siblings — e.g. deny the shared runs dir, allow only this run's.
[policy]
writable_roots = ["{root}/work"]
read_denies = ["{root}/vault"]
read_allows = ["{root}/vault/mine"]

[[fixture]]
path = "{root}/vault/other-secret"
content = "TOPSECRET"
[[fixture]]
path = "{root}/vault/mine/ok.txt"
content = "mine"
[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "cat {root}/vault/other-secret"

[control]
cmd = "cat {root}/vault/mine/ok.txt >/dev/null && echo ok > {root}/work/src/f.txt"
