id = "env-secret-scrub"
category = "secrets"
severity = "critical"
os = ["linux", "macos"]

# F-13: a launcher's environment routinely holds secrets (AWS_*, *_TOKEN). They are
# inherited at exec and are NOT governed by Landlock/Seatbelt, so by default the
# backend scrubs the env to a safe allowlist before spawning the agent. Here the
# launcher exports a secret; the confined agent must NOT see it, yet must still have
# a working PATH/HOME so ordinary tools run (the control proves that).
#
# NOTE: `launcher_env` is a top-level key and MUST stay above the [policy] table,
# or TOML would fold it into [policy] and it would be silently ignored.
launcher_env = ["AWS_SECRET_ACCESS_KEY=leak-me-if-you-can"]

[policy]
writable_roots = ["{root}/work"]

[[fixture]]
path = "{root}/work/src"
dir = true

# ATTACK: succeed (exit 0) only if the secret leaked into the agent's environment.
# Scrubbed by default => the var is empty => `test -n` exits 1 => attack blocked.
[attack]
cmd = 'test -n "$AWS_SECRET_ACCESS_KEY"'

# CONTROL: a legitimate op that needs the surviving allowlist (PATH to find the
# shell builtins, a writable root to land the file). Proves the scrub keeps the
# agent functional rather than breaking it.
[control]
cmd = "echo ok > {root}/work/src/f.txt"
