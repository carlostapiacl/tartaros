# derived from anthropics/sandbox-runtime test/sandbox/credential-deny.test.ts (Apache-2.0)
id = "secrets-env-passthrough-selective"
source = "anthropics/sandbox-runtime test/sandbox/credential-deny.test.ts (Apache-2.0)"
category = "secrets"
severity = "high"
os = ["linux", "macos"]

# Passing ONE non-secret variable through the scrub must not reopen the others:
# the passthrough is per-name, not "inherit everything once anything is asked for".
launcher_env = ["BUILD_FLAVOR=release", "DEPLOY_TOKEN=leak-me-if-you-can"]

[policy]
writable_roots = ["{root}/work"]
env_passthrough = ["BUILD_FLAVOR"]

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = 'test -n "$DEPLOY_TOKEN"'

[control]
# The requested variable did come through with the launcher's value.
cmd = "sh -c 'test \"$BUILD_FLAVOR\" = release && echo ok > {root}/work/src/f.txt'"
