# derived from nolabs-ai/nono tests/integration/test_env_sanitization.sh (LD_PRELOAD, LD_LIBRARY_PATH, DYLD_INSERT_LIBRARIES, PYTHONSTARTUP, NODE_OPTIONS, PERL5OPT) (Apache-2.0)
# Loader / interpreter injection vars in the launcher's env must not reach the
# agent. With the default allowlist scrub this should pass; the stronger nono
# guarantee is the INHERIT variant below. DYLD_* is deliberately not used:
# macOS dyld purges DYLD_* for SIP-protected /bin/sh, which would make the test
# vacuous there.
launcher_env = ["LD_PRELOAD=/nonexistent/evil.so", "NODE_OPTIONS=--require /nonexistent/evil.js", "PYTHONSTARTUP=/nonexistent/evil.py", "PERL5OPT=-M/nonexistent"]
id = "secrets-env-loader-injection-scrub"
source = "nolabs-ai/nono tests/integration/test_env_sanitization.sh (LD_PRELOAD, LD_LIBRARY_PATH, DYLD_INSERT_LIBRARIES, PYTHONSTARTUP, NODE_OPTIONS, PERL5OPT) (Apache-2.0)"
category = "secrets"
severity = "high"
os = ["linux", "macos", "windows"]

[policy]
writable_roots = ["{root}/work"]

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = 'test -n "$LD_PRELOAD$NODE_OPTIONS$PYTHONSTARTUP$PERL5OPT"'

[control]
cmd = 'sh -c "test -n \"$PATH\" && test -n \"$HOME\" && echo ok > {root}/work/src/f.txt"'
