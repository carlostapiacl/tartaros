# derived from anthropics/sandbox-runtime test/sandbox/symlinked-deny-paths.test.ts (Apache-2.0)
id = "trust-handoff-symlinked-claude-dir"
source = "anthropics/sandbox-runtime test/sandbox/symlinked-deny-paths.test.ts (Apache-2.0)"
category = "trust-handoff"
severity = "critical"
os = ["linux", "macos", "windows"]

# The common dotfiles setup: proj/.claude is a RELATIVE symlink into a dotfiles
# tree, and both are inside the writable root. The .claude/commands protection must
# land on the resolved target. A protection walk that skips symlinks would leave
# dotfiles/claude/commands writable through the .claude spelling.
[policy]
writable_roots = ["{root}/work"]

[[fixture]]
path = "{root}/work/dotfiles/claude/commands"
dir = true
[[fixture]]
path = "{root}/work/proj/src"
dir = true
[[fixture]]
path = "{root}/work/proj/.claude"
symlink_to = "../dotfiles/claude"

[attack]
cmd = "echo evil > {root}/work/proj/.claude/commands/evil.md"

[control]
cmd = "echo ok > {root}/work/proj/src/f.txt"

[assert]
absent = "{root}/work/dotfiles/claude/commands/evil.md"
