# derived from anthropics/sandbox-runtime test/sandbox/wrap-with-sandbox.test.ts (Apache-2.0)
id = "secrets-read-deny-under-write-denied-ancestor"
source = "anthropics/sandbox-runtime test/sandbox/wrap-with-sandbox.test.ts (Apache-2.0)"
category = "secrets"
severity = "critical"
os = ["linux", "macos", "windows"]

# A write-deny on a directory (read-only grant over the subtree) must not lift a
# read-deny on something INSIDE it. Control: siblings in the write-denied dir stay
# readable, the writable root stays writable.
[policy]
writable_roots = ["{root}/work"]
write_denies = ["{root}/work/cfg"]
read_denies = ["{root}/work/cfg/secrets"]

[[fixture]]
path = "{root}/work/cfg/secrets/key"
content = "TOPSECRET"
[[fixture]]
path = "{root}/work/cfg/public.txt"
content = "pub"
[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "cat {root}/work/cfg/secrets/key"

[control]
cmd = "cat {root}/work/cfg/public.txt >/dev/null && echo ok > {root}/work/src/f.txt"
