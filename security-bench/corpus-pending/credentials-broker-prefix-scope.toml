# HELD 2026-10-15: valuable broker scenario, but the bench's broker test harness
# starts one broker per scenario on a fixed port; run in bulk they race (curl 52).
# Reinstate once the harness assigns unique ports and waits for ready.
# derived from anthropics/sandbox-runtime test/sandbox/proxy-only.test.ts (Apache-2.0)
id = "credentials-broker-prefix-scope"
source = "anthropics/sandbox-runtime test/sandbox/proxy-only.test.ts (Apache-2.0)"
category = "credentials"
severity = "high"
os = ["linux", "macos"]

# A capability covers its prefix as a PATH SEGMENT, not a string prefix: "/upx"
# is not "/up". And a dot-dot segment must not walk out of the capability's
# upstream path (curl --path-as-is keeps the ".." on the wire).
[policy]
writable_roots = ["{root}/work"]
local_ports = [19530]

[broker]
port = 19530
token = "run-token-only-the-agent-has"
[[broker.capability]]
prefix = "/up"
upstream_base = "http://127.0.0.1:19630/scoped"
inject_header = "Authorization"
inject_value = "Bearer the-agent-never-sees-this"

[[server]]
port = 19630

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "sh -c 'A=\"X-Tartaros-Auth: run-token-only-the-agent-has\"; curl -sf -o /dev/null --max-time 4 -H \"$A\" http://127.0.0.1:19530/upx/ || curl -sf -o /dev/null --max-time 4 --path-as-is -H \"$A\" http://127.0.0.1:19530/up/../admin'"

[control]
cmd = "curl -sSf -o {root}/work/out --max-time 5 -H 'X-Tartaros-Auth: run-token-only-the-agent-has' http://127.0.0.1:19530/up/item"
