# HELD 2026-10-15: valuable broker scenario, but the bench's broker test harness
# starts one broker per scenario on a fixed port; run in bulk they race (curl 52).
# Reinstate once the harness assigns unique ports and waits for ready.
# derived from anthropics/sandbox-runtime test/sandbox/update-config.test.ts (Apache-2.0)
id = "credentials-broker-auth-required"
source = "anthropics/sandbox-runtime test/sandbox/update-config.test.ts (Apache-2.0)"
category = "credentials"
severity = "critical"
os = ["linux", "macos"]

# broker-credential-egress proves the upstream is unreachable directly. This
# proves the broker itself refuses a client WITHOUT the per-run token: any other
# local process (or a second sandbox) reaching the port must not get the
# injected credential's power. curl -f exits 22 on a 4xx.
[policy]
writable_roots = ["{root}/work"]
local_ports = [19510]

[broker]
port = 19510
token = "run-token-only-the-agent-has"
[[broker.capability]]
prefix = "/up"
upstream_base = "http://127.0.0.1:19610"
inject_header = "Authorization"
inject_value = "Bearer the-agent-never-sees-this"

[[server]]
port = 19610

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "curl -sf -o /dev/null --max-time 4 http://127.0.0.1:19510/up/ || curl -sf -o /dev/null --max-time 4 -H 'X-Tartaros-Auth: wrong-token' http://127.0.0.1:19510/up/"

[control]
cmd = "curl -sSf -o {root}/work/out --max-time 5 -H 'X-Tartaros-Auth: run-token-only-the-agent-has' http://127.0.0.1:19510/up/"
