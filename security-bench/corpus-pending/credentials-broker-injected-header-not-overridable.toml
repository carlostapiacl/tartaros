# HELD 2026-10-15: valuable broker scenario, but the bench's broker test harness
# starts one broker per scenario on a fixed port; run in bulk they race (curl 52).
# Reinstate once the harness assigns unique ports and waits for ready.
# derived from anthropics/sandbox-runtime test/sandbox/request-rewriting.test.ts (Apache-2.0)
id = "credentials-broker-injected-header-not-overridable"
source = "anthropics/sandbox-runtime test/sandbox/request-rewriting.test.ts (Apache-2.0)"
category = "credentials"
severity = "high"
os = ["linux", "macos"]

# When the broker injects a credential header, the upstream must receive ONLY
# the broker's value. A spelling the agent sent itself (different case,
# duplicate line) must be stripped, so the agent can neither override the
# credential nor make the upstream pick its own value from a list.
# Needs an upstream that reports what it received: the attack exits 0 if the
# upstream saw the agent's value.
[policy]
writable_roots = ["{root}/work"]
local_ports = [19513]

[broker]
port = 19513
token = "tok-inj"
[[broker.capability]]
prefix = "/up"
upstream_base = "http://127.0.0.1:19613"
inject_header = "Authorization"
inject_value = "Bearer broker-only"

[[server]]
port = 19613
# echo_headers = true   # <-- runner feature needed

[[fixture]]
path = "{root}/work/src"
dir = true

[attack]
cmd = "sh -c 'curl -s --max-time 5 -H \"X-Tartaros-Auth: tok-inj\" -H \"authorization: Bearer agent-chosen\" -H \"AUTHORIZATION: Bearer agent-chosen\" http://127.0.0.1:19513/up/ | grep -q agent-chosen'"

[control]
cmd = "sh -c 'curl -s --max-time 5 -H \"X-Tartaros-Auth: tok-inj\" http://127.0.0.1:19513/up/ -o {root}/work/out'"
