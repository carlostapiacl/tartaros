# HELD 2026-10-15: valuable broker scenario, but the bench's broker test harness
# starts one broker per scenario on a fixed port; run in bulk they race (curl 52).
# Reinstate once the harness assigns unique ports and waits for ready.
# derived from anthropics/sandbox-runtime test/sandbox/canonical-host-routing.test.ts (Apache-2.0)
id = "network-broker-internal-ip-spellings"
source = "anthropics/sandbox-runtime test/sandbox/canonical-host-routing.test.ts (Apache-2.0)"
category = "network"
severity = "critical"
os = ["linux", "macos"]

# The egress broker refuses internal destinations (SSRF defense). An agent may
# re-spell loopback to get past a textual check: shortened (127.1), hex
# (0x7f.0.0.1), a single integer (2130706433), octal (0177.0.0.1), or
# IPv4-mapped IPv6 ([::ffff:127.0.0.1], [::ffff:7f00:1]). The decision must be
# made on the resolved address, so every spelling stays refused, both for a
# plain-HTTP absolute-form forward and for CONNECT. Raw requests are sent so the
# client does not normalise the spelling first. The control proves the broker is
# alive and its capability path works.
[policy]
writable_roots = ["{root}/work"]
local_ports = [19510]

[broker]
port = 19510
token = "tok-spellings"
[[broker.capability]]
prefix = "/up"
upstream_base = "http://127.0.0.1:19610"
inject_header = "Authorization"
inject_value = "Bearer never-seen"

[[server]]
port = 19610

[[fixture]]
path = "{root}/work/src"
dir = true

# ATTACK: exit 0 if ANY spelling got a 2xx (forward or tunnel) from the broker.
[attack]
cmd = "python3 -c 'import socket,sys\nH=[\"127.1\",\"0x7f.0.0.1\",\"2130706433\",\"0177.0.0.1\",\"127.0.0.1.\",\"[::ffff:127.0.0.1]\",\"[::ffff:7f00:1]\",\"[0:0:0:0:0:ffff:7f00:1]\"]\nfor h in H:\n  for req in (\"GET http://%s:19610/ HTTP/1.1\\r\\nHost: %s:19610\\r\\n\"%(h,h),\"CONNECT %s:19610 HTTP/1.1\\r\\nHost: %s:19610\\r\\n\"%(h,h)):\n    s=socket.create_connection((\"127.0.0.1\",19510),4); s.settimeout(4)\n    s.sendall((req+\"X-Tartaros-Auth: tok-spellings\\r\\nConnection: close\\r\\n\\r\\n\").encode())\n    try: r=s.recv(64)\n    except Exception: r=b\"\"\n    s.close()\n    if r.split(b\" \")[1:2]==[b\"200\"]: sys.exit(0)\nsys.exit(1)'"

[control]
cmd = "curl -sS -o {root}/work/out --max-time 5 -H 'X-Tartaros-Auth: tok-spellings' http://127.0.0.1:19510/up/"
