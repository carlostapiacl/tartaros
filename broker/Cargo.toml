[package]
name = "tartaros-broker"
description = "Capability gateway — the one door out of the box: injects secrets so the agent uses a credential without ever holding it"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tartaros-core = { path = "../core" }
ureq = "3.5.0"
# Masked credentials: the broker terminates TLS for the credential's hosts with a
# per-run CA (rcgen), as a rustls server, and re-originates over rustls. Same
# rustls and ring the HTTPS client above already pulls in; webpki-roots is the
# upstream trust store (as ureq's).
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
ring = "0.17.14"
webpki-roots = "1.0.11"

[dev-dependencies]
tartaros-linux = { path = "../backends/linux" }
